# release.yml — tag-triggered signed release (U11, TECH-SPEC §10).
#
# Builds the Whistle app, signs, notarizes, packages a DMG, and publishes it
# to a GitHub Release together with the Sparkle appcast feed itself.
#
# THIS WORKFLOW IS THE ONLY PUBLISHING SURFACE — nothing is hand-edited on
# any other host. SU_FEED_URL (apps/macos/Config/Sparkle.xcconfig) points at
# https://github.com/<owner>/<repo>/releases/latest/download/appcast.xml, so
# the `appcast.xml` asset created below IS the live update feed the moment the
# release is published. See docs/RELEASING.md.
#
# A release must have signing, notarization, and Sparkle credentials. Publishing
# a non-distributable DMG or a release without an appcast asset would make the
# `latest` feed offer a broken update to every existing install.
#
# Required secrets for a FULL release (see SECRETS.md for provisioning):
#   DEVELOPER_ID_P12_BASE64   Developer ID Application cert, base64 .p12
#   DEVELOPER_ID_P12_PASSWORD password for the .p12
#   NOTARY_KEY_ID             App Store Connect API key ID
#   NOTARY_ISSUER_ID          App Store Connect issuer ID
#   NOTARY_KEY_P8_BASE64      ASC API private key (.p8), base64
#   SPARKLE_ED_PRIVATE_KEY    Sparkle EdDSA private key (generate_keys -x)
#
# Versioning: the DMG version comes from MARKETING_VERSION in
# apps/macos/project.yml — bump it in the same change that creates the
# `v*` tag (the appcast step asserts they match).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets

concurrency:
  # GitHub's `latest` release is the live Sparkle feed. Different tags must
  # not publish concurrently, or a slower older tag can replace that feed.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' && secrets.DEVELOPER_ID_P12_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' && secrets.NOTARY_KEY_P8_BASE64 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
      SPARKLE_VERSION: 2.9.4 # keep in lockstep with project.yml's pin
    steps:
      # The published release is the live update feed, so every distribution
      # credential is mandatory. Checked before the ~10-minute build.
      # Checked before the ~10-minute build so it fails fast.
      - name: Require distribution credentials
        if: env.HAS_SIGNING != 'true' || env.HAS_NOTARY != 'true' || env.HAS_SPARKLE_KEY != 'true'
        run: |
          echo "ERROR: release credentials are incomplete (see SECRETS.md)." >&2
          echo "A published release must be Developer-ID signed, notarized, and" >&2
          echo "Sparkle-signed; otherwise the live feed can offer a broken update." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # ---- Codesigning certificate ----------------------------------------
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/whistle-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer_id.p12" \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/developer_id.p12"

      # ---- Notary key ------------------------------------------------------
      - name: Materialize notary API key
        if: env.HAS_NOTARY == 'true'
        env:
          P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary_key.p8"
            echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}"
            echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      # ---- Build / sign / DMG / notarize ----------------------------------
      # package-dmg.sh verifies the imported Developer ID identity and submits
      # the DMG using the notarization credentials prepared above.
      - name: Package DMG
        env:
          REQUIRE_DISTRIBUTION: "true"
        run: ./apps/macos/Scripts/package-dmg.sh

      - name: Locate artifact
        id: artifact
        run: |
          set -euo pipefail
          DMG="$(ls apps/macos/dist/Whistle-*.dmg)"
          VERSION="$(basename "$DMG" .dmg | sed 's/^Whistle-//')"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "ERROR: tag v$TAG does not match MARKETING_VERSION $VERSION (bump apps/macos/project.yml)" >&2
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---- Sparkle appcast (REQUIRED — the feed IS a release asset) --------
      - name: Sign update & generate appcast item
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          # sign_update prints BOTH sparkle:edSignature="…" AND length="…",
          # so SIGNATURE_ATTRS already carries the enclosure length — do not
          # add a second length attribute below (duplicate attrs are invalid XML).
          SIGNATURE_ATTRS="$("$RUNNER_TEMP/sparkle/bin/sign_update" -f "$RUNNER_TEMP/sparkle_ed_key" "$DMG")"
          rm -f "$RUNNER_TEMP/sparkle_ed_key"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            apps/macos/dist/DerivedData/Build/Products/Release/Whistle.app/Contents/Info.plist)"
          cat > apps/macos/dist/appcast-item.xml <<ITEM
          <item>
            <title>Version ${VERSION}</title>
            <pubDate>$(date -R)</pubDate>
            <sparkle:version>${BUILD_NUMBER}</sparkle:version>
            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
            <enclosure
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$DMG")"
              ${SIGNATURE_ATTRS}
              type="application/octet-stream" />
          </item>
          ITEM
          echo "Appcast item written to apps/macos/dist/appcast-item.xml"

      # Wraps the signed item in a complete feed published as the `appcast.xml`
      # release asset, which is what SU_FEED_URL
      # (…/releases/latest/download/appcast.xml) resolves to. The feed carries
      # only the CURRENT release: Sparkle offers the newest applicable item, all
      # releases share minimumSystemVersion 14.0, and no item carries release
      # notes, so historical items would change nothing. Each release keeps its
      # own appcast-item.xml asset, so history stays reconstructible.
      # (Concatenating history was tried and rejected: v1.0.9's published item
      # has a duplicate `length` attribute — see the note above — so it is
      # invalid XML, and one bad historical asset would break every future
      # release's feed.)
      - name: Assemble appcast feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # sparkle:version must strictly increase or Sparkle never offers the
          # update. Compare against the release that `latest` points at today.
          BUILD_NUMBER="$(grep -o '<sparkle:version>[^<]*' apps/macos/dist/appcast-item.xml | sed 's/.*>//')"
          PRIOR_TAG="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases \
            --json tagName -q '.[0].tagName // empty')"
          if [[ -n "$PRIOR_TAG" ]]; then
            # The release before this migration has an item but no complete
            # feed. Build and upload one before publishing, so deleting this
            # release really rolls `latest` back to a working appcast.
            gh release download "$PRIOR_TAG" --pattern appcast-item.xml \
              --output "$RUNNER_TEMP/prior-item.xml"
            PRIOR="$(grep -o '<sparkle:version>[^<]*' "$RUNNER_TEMP/prior-item.xml" | sed 's/.*>//')"
            version_is_greater() {
              local candidate="$1"
              local prior="$2"
              local i candidate_part prior_part
              local -a candidate_parts prior_parts
              IFS=. read -r -a candidate_parts <<< "$candidate"
              IFS=. read -r -a prior_parts <<< "$prior"
              for ((i = 0; i < ${#candidate_parts[@]} || i < ${#prior_parts[@]}; i++)); do
                candidate_part="${candidate_parts[i]:-0}"
                prior_part="${prior_parts[i]:-0}"
                [[ "$candidate_part" =~ ^[0-9]+$ && "$prior_part" =~ ^[0-9]+$ ]] || return 2
                if ((10#$candidate_part > 10#$prior_part)); then return 0; fi
                if ((10#$candidate_part < 10#$prior_part)); then return 1; fi
              done
              return 1
            }
            if ! version_is_greater "$BUILD_NUMBER" "$PRIOR"; then
              echo "ERROR: sparkle:version $BUILD_NUMBER does not exceed $PRIOR_TAG's $PRIOR —" >&2
              echo "Sparkle would never offer this update. Bump MARKETING_VERSION." >&2
              exit 1
            fi
            echo "sparkle:version $BUILD_NUMBER > $PRIOR_TAG's $PRIOR"
          else
            echo "No prior release to compare against (first release)."
          fi
          write_feed() {
            local item="$1"
            local output="$2"
            {
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' \
              '  <channel>' \
              '    <title>Whistle</title>' \
              "    <link>https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml</link>" \
              '    <description>Sparkle update feed for the Whistle macOS app.</description>' \
              '    <language>en</language>'
              sed 's/^/    /' "$item"
            printf '%s\n' '  </channel>' '</rss>'
            } > "$output"
          }
          write_feed apps/macos/dist/appcast-item.xml apps/macos/dist/appcast.xml
          xmllint --noout apps/macos/dist/appcast.xml
          if [[ -n "$PRIOR_TAG" ]]; then
            write_feed "$RUNNER_TEMP/prior-item.xml" "$RUNNER_TEMP/appcast.xml"
            xmllint --noout "$RUNNER_TEMP/appcast.xml"
            gh release upload "$PRIOR_TAG" "$RUNNER_TEMP/appcast.xml" --clobber
          fi
          echo "--- apps/macos/dist/appcast.xml ---"
          cat apps/macos/dist/appcast.xml

      # ---- Publish -----------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifact.outputs.dmg }}
        run: |
          set -euo pipefail
          # Whistle.dmg is an unversioned COPY so the download page can link to a
          # permanent …/releases/latest/download/Whistle.dmg and never be edited
          # again. The appcast <enclosure> keeps pointing at the VERSIONED asset —
          # the EdDSA signature binds to exact bytes, and this alias's contents
          # change every release.
          cp "$DMG" apps/macos/dist/Whistle.dmg
          # Three-phase publish, so a failed run never wedges the tag and never
          # deletes an already-published release:
          #   1. create an EMPTY draft (invisible to `/releases/latest`);
          #   2. arm cleanup only AFTER that draft exists;
          #   3. upload the assets, then un-draft.
          # `gh release create` uploads assets as a second step of the same
          # command, so a mid-upload failure of a combined create+upload would
          # leave a draft while the post-command `release_created=true` never
          # ran — the trap would then skip cleanup and wedge the tag. Splitting
          # create from upload lets the trap fire on an upload failure. And
          # arming cleanup only after a successful create means a failed create
          # (e.g. a release for this tag already exists on a rerun) leaves that
          # existing release untouched.
          release_created=false
          cleanup_draft() {
            if [[ "$release_created" == true ]]; then
              gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
            fi
          }
          trap cleanup_draft ERR INT TERM
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Whistle $GITHUB_REF_NAME" \
            --generate-notes
          release_created=true
          gh release upload "$GITHUB_REF_NAME" \
            "$DMG" \
            apps/macos/dist/Whistle.dmg \
            apps/macos/dist/appcast.xml \
            apps/macos/dist/appcast-item.xml
          gh release edit "$GITHUB_REF_NAME" --draft=false
          trap - ERR INT TERM
