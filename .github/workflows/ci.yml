# ci.yml — PR/push test suite (U11, TECH-SPEC §10).
#
# Two jobs, mirroring the local verification ladder (TECH-SPEC §2a
# Definition of done):
#   backend — vitest/convex-test matrix (packages/backend), ubuntu-latest
#   macos   — plain SPM `swift test` (packages/whistle-core), then
#             xcodegen + `xcodebuild test` for the Whistle app target, both
#             on a single macos-26 runner (one VM instead of two — macOS
#             minutes are billed at 10x, see incident 2026-07-08/09).
#
# No secrets required: Debug builds are ad-hoc signed (project.yml), the
# backend tests run against a fully mocked Conductor, and auth is
# MockAuthProvider throughout (TECH-SPEC §9).
#
# Runner note: the app target compiles SpeechAnalyzerTranscriber against
# the macOS 26 SDK behind #available (U7), so the mac job needs an Xcode
# that carries that SDK — hence the macos-26 image, whose default
# /Applications/Xcode.app is a 26.x toolchain.
#
# timeout-minutes on every job is a hard backstop: a crashing test that
# touches real audio hardware on this sandboxed runner can otherwise trip
# xcodebuild's crash-recovery into an hours-long restart loop (see
# CapturePanelControllerTests / AudioEngineTap — fixed by injecting a fake
# TranscriptionService instead of the real one, but the timeout stays as
# a guardrail against the next one).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vitest / convex-test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test

  macos:
    name: macOS (swift test + xcodebuild test)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path packages/whistle-core
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/macos
        run: xcodegen generate
      - name: xcodebuild test
        working-directory: apps/macos
        run: |
          set -o pipefail
          xcodebuild test \
            -project Whistle.xcodeproj \
            -scheme Whistle \
            -destination 'platform=macOS' \
            | tail -n 60
