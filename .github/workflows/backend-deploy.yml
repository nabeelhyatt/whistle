# backend-deploy.yml — deploy the Convex backend on pushes to main
# (U11, TECH-SPEC §10).
#
# ENV-GATED (TECH-SPEC §10): the deploy step runs only when the
# CONVEX_DEPLOY_KEY secret is provisioned; until then the workflow succeeds
# with a logged skip so it is authored-correct before secrets exist.
#
# Required secret (see SECRETS.md):
#   CONVEX_DEPLOY_KEY — production deploy key for team `nabeelo`,
#                       project `whistle` (Convex dashboard → Settings →
#                       Deploy keys).

name: Backend deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-deploy.yml"

# Read-only GITHUB_TOKEN: this workflow only checks out and runs tests before
# deploying, and the Convex deploy authenticates with CONVEX_DEPLOY_KEY rather
# than the Actions token, so it needs nothing else.
permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Convex deploy
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Runs unconditionally (outside the HAS_DEPLOY_KEY gate below) so a
      # broken backend fails this workflow even while deploys are still
      # skipped for lack of a provisioned secret — otherwise a red backend
      # would sit silently until the key showed up. The deploy step below
      # still can't run past a failure here: its `if:` carries no status
      # function, so Actions keeps the implicit `success()` check.
      #
      # -C form, not --filter: `pnpm --filter <pkg> <script>` exits 0 when the
      # script or package doesn't match, which would turn this pre-deploy gate
      # into a silent no-op if the script were ever renamed.
      - run: pnpm -C packages/backend run test

      # Fail loudly rather than skip-and-pass. This step is the fix for this
      # workflow's own worst bug: the deploy used to be gated on
      # HAS_DEPLOY_KEY with a companion "Skip deploy" step that echoed a
      # notice and exited 0, so with the secret unprovisioned the workflow
      # went GREEN while deploying nothing. Backend changes merged to main
      # and never reached users, with no red build anywhere — PR #38's
      # workspace-title change sat undeployed for a day exactly this way.
      # The secret is provisioned now, so a missing key means it was revoked,
      # rotated, or lost, and that must stop the run. Mirrors release.yml,
      # which likewise fails before building when distribution secrets are
      # absent.
      - name: Require CONVEX_DEPLOY_KEY
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "::error::CONVEX_DEPLOY_KEY is not provisioned — the backend was NOT deployed. See SECRETS.md section 4."
          exit 1

      - name: Deploy to Convex
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes
